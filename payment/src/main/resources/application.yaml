server:
  port: 8013
  servlet:
    context-path: /

spring:
  application:
    name: payment-service
  profiles:
    active: dev
  cloud:
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
        instance:
          prefer-ip-address: true
          lease-renewal-interval-in-seconds: 10
          lease-expiration-duration-in-seconds: 30
      instance:
        instance-id: ${spring.application.name}:${server.port}
    stream:
      # 直接以 queue 名作为 destination，Spring Cloud Stream 用默认 exchange 路由
      bindings:
        paymentCreate-in-0:
          destination: payment.create
          group: payment-service-group
        paymentSuccess-out-0:
          destination: order.payment-callback
          group: payment-service-group
    # ⚠️ Spring Cloud Function 5.0.0 起属性前缀改为 spring.cloud.function（不再嵌在 stream 下）。
    # 5.0.4 起已移除「函数名=Bean 名」别名语法，函数名必须直接等于 Bean 名，
    # 且 Bean 名必须等于 binding 前缀（paymentCreate-in-0 → Bean 名 paymentCreate）。
    function:
      definition: paymentCreate


# Outbox 可靠消息调度器
outbox:
  dispatcher:
    enabled: true
    # 单次扫描消息条数上限
    batch-size: 50
    # 扫描间隔（毫秒），指数退避由 OutboxMessage 内部维护
    interval-ms: 3000

logging:
  file:
    path: ./logs
  config: classpath:logback-spring-${spring.profiles.active}.xml
