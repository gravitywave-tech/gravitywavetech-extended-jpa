server:
  port: 8013
  servlet:
    context-path: /

spring:
  application:
    name: payment-service
  profiles:
    active: dev
  cloud:
    eureka:
      client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
        instance:
          prefer-ip-address: true
          lease-renewal-interval-in-seconds: 10
          lease-expiration-duration-in-seconds: 30
      instance:
        instance-id: ${spring.application.name}:${server.port}
    stream:
      # 直接以 queue 名作为 destination，Spring Cloud Stream 用默认 exchange 路由
      bindings:
        paymentCreate-in-0:
          destination: payment.create
          group: payment-service-group
        paymentSuccess-out-0:
          destination: order.payment-callback
          group: payment-service-group
      function:
        # 语法：函数名=Bean 名（函数名必须等于 binding 前缀，如 paymentCreate-in-0 → 函数名 paymentCreate）
        definition: paymentCreate=createPaymentConsumer
  jpa:
    hibernate:
      # dev 环境自动建表（含 t_outbox_message）；生产环境请改用 Flyway/Liquibase
      ddl-auto: update

# Outbox 可靠消息调度器
outbox:
  dispatcher:
    enabled: true
    # 单次扫描消息条数上限
    batch-size: 50
    # 扫描间隔（毫秒），指数退避由 OutboxMessage 内部维护
    interval-ms: 3000

logging:
  file:
    path: ./logs
  config: classpath:logback-spring-${spring.profiles.active}.xml
