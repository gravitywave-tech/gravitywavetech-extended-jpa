# P6Spy \u914D\u7F6E\u6587\u4EF6
# \u751F\u6210\u5B8C\u6574\u53EF\u6267\u884C\u7684 SQL \u8BED\u53E5\uFF08\u53C2\u6570\u503C\u76F4\u63A5\u62FC\u63A5\u5728\u8BED\u53E5\u4E2D\uFF09
# https://p6spy.readthedocs.io/

# \u6A21\u5757\u52A0\u8F7D
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory
# \u771F\u5B9E\u6570\u636E\u6E90\u9A71\u52A8
driverlist=com.mysql.cj.jdbc.Driver

# \u65E5\u5FD7\u8F93\u51FA\u5230\u6807\u51C6\u8F93\u51FA\u3002\u9009\u7528 StdoutLogger \u4E0D\u8D70 slf4j\uFF1A
# \u4E00\u662F\u7ED5\u8FC7 p6spy 3.x \u4E2D Slf4JLogger \u5185\u90E8 logger \u547D\u540D\u4E0D\u4E00\u81F4\u7684\u5751\uFF0C
# \u4E8C\u662F p6spy \u4E0D\u652F\u6301\u9017\u53F7\u5206\u9694\u591A\u4E2A appender\uFF08\u4F1A\u62A5 ClassNotFoundException\uFF09\uFF0C
# \u800C\u8C03\u8BD5\u671F\u53EA\u9700\u4E00\u4E2A\u76F4\u63A5\u51FA\u5230\u63A7\u5236\u53F0\u7684\u989C\u8272\u3002
appender=com.p6spy.engine.spy.appender.StdoutLogger
logfile = logs/p6spy-sql.log
# \u5173\u95ED\u8FDE\u63A5\u6CC4\u6F0F\u68C0\u6D4B\uFF08\u907F\u514D\u5E72\u6270\uFF09
outagedetection = false

# \u4F7F\u7528\u81EA\u5B9A\u4E49\u683C\u5F0F\u5316\u5668
#logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
logMessageFormat=org.gravitywavetech.framework.config.CustomP6SpyLogger

# \u81EA\u5B9A\u4E49\u683C\u5F0F\uFF1A\u76F4\u63A5\u8F93\u51FA\u5B8C\u6574 SQL
# \u53C2\u6570\u503C\u4F1A\u81EA\u52A8\u66FF\u6362\u5230 ? \u4F4D\u7F6E\uFF0C\u751F\u6210\u53EF\u76F4\u63A5\u6267\u884C\u7684 SQL
customLogMessageFormat=/* %(currentTime) | took %(executionTime)ms | conn %(connectionId) */
%(sql)

# \u8FFD\u52A0\u6A21\u5F0F
append = true
excludecategories=info,debug,result,resultset